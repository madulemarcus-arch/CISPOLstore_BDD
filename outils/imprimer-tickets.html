<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Impression des tickets Wi-Fi</title>
<style>
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f5f7;color:#14171c}
.noprint{max-width:760px;margin:0 auto;padding:16px}
.noprint h1{margin:0 0 4px;color:#1e435e;font-size:1.4rem}
.noprint p{margin:0 0 12px;color:#4d5562}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:10px}
label{display:block;font-size:.85rem;color:#4d5562}
input,textarea{width:100%;box-sizing:border-box;font:inherit;padding:9px;border:1px solid #c9ced6;border-radius:10px;margin-top:3px}
textarea{min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace}
button{font:inherit;font-weight:700;padding:12px 18px;border:0;border-radius:10px;background:#1e435e;color:#fff;cursor:pointer;margin-top:10px}
#info{color:#d85833;font-weight:600;margin-left:10px}
#print{display:grid;grid-template-columns:repeat(4,52mm);gap:3mm;grid-auto-rows:25mm;color:#1b2733;padding:16px;justify-content:center}
.ticket{position:relative;overflow:hidden;break-inside:avoid;background:#fff}
  .ticket {
    position: relative; overflow: hidden; break-inside: avoid; text-align: center;
    border: 0.4mm solid #1e435e; border-radius: 3.5mm; background: #fff;
    outline: 0.3mm dashed #9aa5b0; outline-offset: 1.2mm;   /* cut line */
  }
  .t-top { display: flex; align-items: center; justify-content: center; gap: 1.8mm; padding: 1.8mm 2mm; background: #1e435e; color: #fff; }
  .t-logo { width: 7.5mm; height: 7.5mm; border-radius: 1.6mm; background: #fff; padding: 0.6mm; object-fit: contain; }
  .t-brand { font-weight: 800; font-size: 9.5pt; letter-spacing: .01em; line-height: 1.05; text-align: left; }
  .t-brand .accent2 { color: #f0a58a; }
  .t-brand small { display: block; font-size: 5.5pt; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #e5af42; margin-top: .5mm; }
  .t-body { padding: 2.2mm 1.5mm 1.2mm; }
  .t-label { font-size: 5.5pt; letter-spacing: .12em; text-transform: uppercase; color: #6b7785; }
  .t-code {
    font: 800 13.5pt ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; color: #1e435e;
    margin: 1.4mm auto 1.6mm; padding: 1.2mm 1.4mm; width: fit-content;
    border: 0.35mm dashed #d85833; border-radius: 2mm; background: #fff7f3;
  }
  .t-plan { display: flex; align-items: center; justify-content: center; gap: 1.4mm; flex-wrap: wrap; font-size: 7pt; }
  .t-pill { background: #d85833; color: #fff; font-weight: 700; padding: 0.5mm 2mm; border-radius: 10mm; }
  .t-dur { color: #3b4a58; font-weight: 600; }
  .t-mid { display: flex; align-items: center; justify-content: space-between; gap: 1.5mm; margin: 0.6mm 2mm 1.4mm; }
  .t-steps { flex: 1; margin: 0; padding: 0 0 0 3.4mm; text-align: left; font-size: 6.3pt; line-height: 1.35; color: #3b4a58; }
  .t-qr { flex: none; width: 15mm; height: 15mm; border: 0.2mm solid #d6dbe1; border-radius: 1mm; }
  .t-steps li::marker { color: #d85833; font-weight: 800; }
  .t-foot { display: flex; justify-content: space-between; gap: 1mm; padding: 1.4mm 2mm; font-size: 6.3pt; font-weight: 700; color: #1e435e; background: #fdf3dc; border-top: 0.5mm solid #e5af42; }
  .t-foot span:last-child { font-weight: 600; color: #6b5a2a; }

  /* compact layout: 40 tickets per A4 page (4 x 10) */
  #print .ticket { display: flex; flex-direction: column; border-radius: 2.5mm; outline-offset: 0.9mm; text-align: left; }
  .c-top { display: flex; align-items: center; gap: 1.4mm; padding: 0.6mm 1.8mm; background: #1e435e; color: #fff; }
  .c-top .t-logo { width: 4.6mm; height: 4.6mm; border-radius: 1mm; padding: 0.3mm; }
  .c-brand { flex: 1; font-weight: 800; font-size: 9pt; line-height: 1; white-space: nowrap; }
  .c-brand .accent2 { color: #f0a58a; }
  .c-price { background: #e5af42; color: #1e435e; font-weight: 800; font-size: 7.4pt; padding: 0.3mm 1.6mm; border-radius: 10mm; white-space: nowrap; }
  .c-main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: space-between; gap: 1.2mm; padding: 0.4mm 1.6mm 0.5mm 1.8mm; }
  .c-left { flex: 1; min-width: 0; }
  #print .t-code { font: 800 12pt ui-monospace, Menlo, Consolas, monospace; letter-spacing: .04em; color: #1e435e; margin: 0 0 0.5mm; padding: 0.3mm 1.2mm; width: fit-content; border: 0.3mm dashed #d85833; border-radius: 1.4mm; background: #fff7f3; }
  .c-plan { font-size: 7.4pt; color: #d85833; margin-bottom: 0.3mm; line-height: 1.1; }
  .c-plan b { font-weight: 800; }
  .c-help { font-size: 6.2pt; line-height: 1.12; color: #3b4a58; }
  #print .t-qr { flex: none; width: 15mm; height: 15mm; border: 0; border-radius: 0; }

@media print{
  @page{size:A4;margin:8mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff}
  .noprint{display:none!important}
  #print{grid-template-columns:repeat(4,1fr);padding:0;justify-content:stretch}
}

<p>Collez les codes (un par ligne) ou tout le contenu du fichier <b>.rsc</b> : les codes sont reconnus automatiquement. Puis cliquez sur « Aperçu ».</p>
<div class="grid">
<label>Nom de l’entreprise<input id="biz" value="CispolStore"></label>
<label>Nom du Wi-Fi<input id="ssid" value="MALWEKA WIFI zone"></label>
<label>Adresse de connexion (QR)<input id="host" value="wifi.cispolstore" placeholder="vide = pas de QR"></label>
<label>Forfait<input id="plan" value="Jour"></label>
<label>Prix (FC)<input id="price" type="number" value="1000"></label>
<label>Durée (minutes)<input id="mins" type="number" value="1440"></label>
</div>
<label>Codes<textarea id="codes" placeholder="J3ENKV&#10;J2R96A&#10;…"></textarea></label>
<button id="go">Aperçu</button><button id="prt" style="background:#d85833">🖨️ Imprimer</button><span id="info"></span>
</div>

  // ---------- QR code ----------
  // Minimal QR encoder (byte mode, error correction L, versions 1-6, enough for a login link): returns a boolean matrix.

function parseCodes(t){
  const fromRsc=[...t.matchAll(/user add name="([^"]+)"/g)].map(m=>m[1]);
  const list=fromRsc.length?fromRsc:t.split(/[\s,;]+/).filter(x=>/^[A-Za-z0-9]{4,}$/.test(x));
  return [...new Set(list.map(x=>x.toLowerCase()))];
}
function render(){
  const codes=parseCodes($('codes').value);
  const host=$('host').value.trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'');
  const ssid=$('ssid').value, plan=$('plan').value, price=+$('price').value||0, mins=+$('mins').value||0, biz=$('biz').value;
  const qr=c=>host?qrSvg(`http://${host}/login?username=${c}`):'';
  $('print').innerHTML=codes.map(c=>`<div class="ticket">
    <div class="c-top"><img class="t-logo" src="${LOGO}" alt="" width="40" height="40"><span class="c-brand">${brandHtml(biz)}</span><span class="c-price">${fc(price)}</span></div>
    <div class="c-main"><div class="c-left"><div class="t-code">${esc(c.toUpperCase())}</div>
    <div class="c-plan"><b>${esc(plan)}</b> · ${esc(fmtDuration(mins))}</div>
    <div class="c-help">Activez <b>${esc(ssid)}</b>, puis ${host?'scannez le QR ou tapez':'tapez'} le code</div></div>${qr(c)}</div></div>`).join('');
  const pages=Math.ceil(codes.length/40);
  $('info').textContent=codes.length?`${codes.length} ticket(s), ${pages} page(s)`:'Aucun code reconnu';
  return codes.length;
}
$('go').onclick=render;
$('prt').onclick=()=>{if(render())window.print();};
</script></body></html>
